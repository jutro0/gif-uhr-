
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-container {
            width: 90%;
            max-width: 1100px;
            aspect-ratio: 16 / 9;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <div class="video-container">
        <iframe
            id="video"
            src="https://www.youtube.com/embed/qqwnTgIEED8?autoplay=1"
            allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
            allowfullscreen>
        </iframe>
    </div>

    <script>
        setTimeout(() => {
            document.getElementById("video").src =
                "https://www.youtube.com/embed/mNyM9tYxl-E?autoplay=1";
        }, 10000);
    </script>

</body>
</html>
