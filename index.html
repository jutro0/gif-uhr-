<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wideo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #video2 {
            display: none;
        }
        #start-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
        }
        #start-btn {
            padding: 16px 36px;
            font-size: 18px;
            font-weight: bold;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <button id="start-btn">Odtwórz</button>
    </div>

    <video id="video1" preload="auto" playsinline>
        <source src="video_1.mp4" type="video/mp4">
    </video>

    <video id="video2" preload="auto" playsinline>
        <source src="video_2.mp4" type="video/mp4">
    </video>

    <script>
        const v1 = document.getElementById('video1');
        const v2 = document.getElementById('video2');
        const overlay = document.getElementById('start-overlay');
        let switched = false;

        overlay.addEventListener('click', () => {
            overlay.style.display = 'none';
            v1.play();
        });

        v1.addEventListener('timeupdate', () => {
            if (!switched && v1.currentTime >= 10) {
                switched = true;
                v2.style.display = 'block';
                v2.play();
                v1.style.display = 'none';
                v1.pause();
            }
        });
    </script>
</body>
</html>
