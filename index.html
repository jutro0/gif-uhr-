<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wideo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .video-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        .player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: opacity 0.15s ease;
        }
        #player1-container {
            z-index: 2;
            opacity: 1;
        }
        #player2-container {
            z-index: 1;
            opacity: 0;
            pointer-events: none;
        }
        #start-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            font-family: sans-serif;
            cursor: pointer;
        }
        #start-btn {
            padding: 16px 36px;
            font-size: 18px;
            font-weight: bold;
            background: #ff0000;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <button id="start-btn">Odtwórz</button>
    </div>

    <div class="video-wrapper">
        <div id="player1-container" class="player-container">
            <div id="player1"></div>
        </div>
        <div id="player2-container" class="player-container">
            <div id="player2"></div>
        </div>
    </div>

    <script>
        let player1, player2;
        let switched = false;
        let checkInterval;

        // Ładowanie oficjalnego API YouTube
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player1 = new YT.Player('player1', {
                videoId: 'qqwnTgIEED8',
                width: '100%',
                height: '100%',
                playerVars: {
                    'controls': 0,
                    'rel': 0,
                    'playsinline': 1,
                    'modestbranding': 1
                }
            });

            player2 = new YT.Player('player2', {
                videoId: 'mNyM9tYxl-E',
                width: '100%',
                height: '100%',
                playerVars: {
                    'controls': 0,
                    'rel': 0,
                    'playsinline': 1,
                    'modestbranding': 1
                },
                events: {
                    'onReady': function(e) {
                        // Wstępne buforowanie drugiego filmu po cichu
                        e.target.mute();
                        e.target.playVideo();
                        setTimeout(() => {
                            e.target.pauseVideo();
                            e.target.seekTo(0);
                            e.target.unMute();
                        }, 1500);
                    }
                }
            });
        }

        // Start po kliknięciu (wymagane przez przeglądarki dla odtwarzania z dźwiękiem)
        document.getElementById('start-overlay').addEventListener('click', function() {
            this.style.display = 'none';
            player1.playVideo();

            checkInterval = setInterval(() => {
                if (!switched && player1 && typeof player1.getCurrentTime === 'function') {
                    if (player1.getCurrentTime() >= 10) {
                        switchVideos();
                    }
                }
            }, 50); // Sprawdzanie co 50 ms dla maksymalnej precyzji
        });

        function switchVideos() {
            switched = true;
            clearInterval(checkInterval);

            const p1Box = document.getElementById('player1-container');
            const p2Box = document.getElementById('player2-container');

            player2.seekTo(0);
            player2.playVideo();

            p2Box.style.zIndex = '3';
            p2Box.style.opacity = '1';
            p2Box.style.pointerEvents = 'auto';

            setTimeout(() => {
                player1.stopVideo();
                p1Box.style.display = 'none';
            }, 200);
        }
    </script>
</body>
</html>
